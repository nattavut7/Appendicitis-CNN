name: Unit checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q appendicitis_r2 main.py scripts tests
      - run: pytest -q
      - run: python main.py inspect-model --config configs/r2.yaml > /dev/null
